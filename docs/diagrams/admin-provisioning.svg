<rect x="800" y="413" width="210" height="64" rx="12" fill="#fff3d9" stroke="#b9770e" stroke-width="2"/>
<text x="905" y="449" font-size="13.5" text-anchor="middle" fill="#1d2032">Watch progress and logs</text>
