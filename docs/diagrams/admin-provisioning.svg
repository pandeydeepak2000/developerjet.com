<text x="905" y="551" font-size="13.5" text-anchor="middle" fill="#1d2032">Success: service active,</text>
<text x="905" y="567" font-size="13.5" text-anchor="middle" fill="#1d2032">customer notified</text>
<rect x="550" y="523" width="210" height="64" rx="12" fill="#fde8e8" stroke="#a12a2a" stroke-width="2"/>
