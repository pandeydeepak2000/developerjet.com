<text x="655" y="567" font-size="13.5" text-anchor="middle" fill="#1d2032">inactive</text>
<rect x="300" y="523" width="210" height="64" rx="12" fill="#fff3d9" stroke="#b9770e" stroke-width="2"/>
<text x="405" y="551" font-size="13.5" text-anchor="middle" fill="#1d2032">Fix cause, retry (resumes</text>
<text x="405" y="567" font-size="13.5" text-anchor="middle" fill="#1d2032">at failed step)</text>
<rect x="50" y="523" width="210" height="64" rx="12" fill="#fff3d9" stroke="#b9770e" stroke-width="2"/>
<text x="155" y="559" font-size="13.5" text-anchor="middle" fill="#1d2032">Escalate per runbook</text>
<rect x="30" y="646" width="16" height="16" rx="4" fill="#e3f4ea" stroke="#1c7a43" stroke-width="2"/><text x="52" y="659" font-size="12.5" fill="#333">Automatic (system)</text>
<rect x="196" y="646" width="16" height="16" rx="4" fill="#fff3d9" stroke="#b9770e" stroke-width="2"/><text x="218" y="659" font-size="12.5" fill="#333">Manual (admin / human)</text>
<rect x="390" y="646" width="16" height="16" rx="4" fill="#ffffff" stroke="#6649d1" stroke-width="2"/><text x="412" y="659" font-size="12.5" fill="#333">Customer action</text>
